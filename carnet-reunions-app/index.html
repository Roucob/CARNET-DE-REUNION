<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de réunions</title>
<meta name="description" content="Prépare tes réunions et retrouve tes commentaires, même hors connexion.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12101b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* VOICE: calme, personnel, encourageant — un carnet d'étude qu'on ouvre chaque matin
   IDEA: le carnet de préparation : chaque partie du programme suivie de sa fiche de commentaire
   PICTURE: carnet ouvert violet avec bulle et coche (bannière), fiches-cartes du programme
   COLOUR and TYPE: lavande/violet pour le mercredi, terre cuite pour le samedi ; Inter 800 serré pour les titres
   LAYOUT: une colonne mobile (max 760px), onglets en haut, cartes arrondies */
/* Couleurs en variables classiques (compatibles avec les anciens iPhone/Android, contrairement à light-dark()) */
:root{color-scheme:light;
--bg:#f6f5fb;--card:#fff;--ink:#1f1b3a;--muted:#6b6880;--line:#e6e2f3;--vi:#5a45c6;--vibtn:#6550cf;--lav:#efeafd;--lav2:#f4f1fe;
--te:#a3443a;--peach:#fdece6;--peach2:#fff8f5;--ok:#1f7a4d;--okbg:#e5f5ec;--h1:#f3effe;--h2:#e9e2fd;--hb:#e0d8fa;--sb:#f4ddd5;--fs:13.5px}
@media(prefers-color-scheme:dark){:root:not([data-mode=light]):not([data-theme=light]){color-scheme:dark;
--bg:#12101b;--card:#1c1a29;--ink:#eeecf7;--muted:#a6a3bb;--line:#2d2a42;--vi:#ab9cff;--vibtn:#7b68e8;--lav:#2a2446;--lav2:#221e36;
--te:#f2a596;--peach:#3a2420;--peach2:#241a1a;--ok:#7fd6a6;--okbg:#183326;--h1:#231d3d;--h2:#2b2350;--hb:#3a3160;--sb:#3a2a28}}
:root[data-mode=dark],:root[data-theme=dark]{color-scheme:dark;
--bg:#12101b;--card:#1c1a29;--ink:#eeecf7;--muted:#a6a3bb;--line:#2d2a42;--vi:#ab9cff;--vibtn:#7b68e8;--lav:#2a2446;--lav2:#221e36;
--te:#f2a596;--peach:#3a2420;--peach2:#241a1a;--ok:#7fd6a6;--okbg:#183326;--h1:#231d3d;--h2:#2b2350;--hb:#3a3160;--sb:#3a2a28}
*{box-sizing:border-box;min-width:0}
b,strong,dt{font-weight:500}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
a{color:var(--vi)}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#8a6cf0,#5a3fc4);display:grid;place-items:center;box-shadow:0 8px 18px #5a3fc440;flex:none}
.brand b{font-size:15px;letter-spacing:-.01em;flex:1}
.theme{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:36px;padding:0 12px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
nav{display:flex;gap:6px;padding:6px 0 10px;overflow-x:auto}
nav a{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap;min-height:38px}
nav svg{width:17px;height:17px}
nav svg,.btn svg,.refs svg,.acts svg,.srcs svg,.wk svg{flex:none}
.pill{white-space:nowrap}
nav a[aria-current=page]{background:var(--lav);color:var(--vi)}
h1{font-size:clamp(21px,5.6vw,27px);line-height:1.1;letter-spacing:-.025em;margin:18px 0 4px;font-weight:600;text-wrap:balance}
h2{font-size:17px;letter-spacing:-.015em;margin:22px 0 8px;font-weight:600;line-height:1.1}
h3{font-size:14.5px;font-weight:500;margin:0;line-height:1.25;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--vi);font-weight:500;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--vibtn);border-color:transparent;color:#fff;box-shadow:0 6px 14px #5a45c633}
.btn.soft{background:var(--lav);border-color:transparent}
.btn.te{background:var(--peach);border-color:transparent;color:var(--te)}
.btn:focus-visible,nav a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--vi);outline-offset:2px}
.weeknav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:3px;margin:4px 0 14px}
.weeknav button{width:40px;height:40px;border:0;background:none;border-radius:14px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.weeknav button:disabled{opacity:.25}
.weeknav span{display:flex;gap:8px;align-items:center;font-weight:500;font-size:15px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));border:1.5px solid var(--hb);border-radius:20px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);color:var(--vi);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.hero h2{margin:8px 0 4px;font-size:clamp(17px,4.6vw,21px)}
.hero p{margin:0;color:var(--muted)}
.hero .ready{margin-top:8px;font-size:12.5px;color:var(--vi);font-weight:500}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.rowhead a{font-weight:500;text-decoration:none;font-size:13px}
.meet{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px}
.tile{width:52px;height:52px;border-radius:13px;background:var(--lav);color:var(--vi);display:grid;place-items:center;text-align:center;line-height:1}
.tile b{font-size:20px;display:block;font-weight:500}.tile small{font-size:10.5px;font-weight:500;letter-spacing:.04em}
.sat .tile{background:var(--peach);color:var(--te)}
.meet .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.status{flex:none;background:var(--lav2);color:var(--muted);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.status.ok{background:var(--okbg);color:var(--ok)}
.meta{color:var(--muted);margin:4px 0 0}
.focus{grid-column:1/-1;background:var(--lav2);border-radius:13px;padding:10px 12px;display:flex;gap:10px}
.sat .focus{background:var(--peach2)}
.focus small{color:var(--muted);font-weight:500;display:block;font-size:12px}.focus b{font-size:14.5px;line-height:1.35}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
.foot span{display:flex;gap:8px;align-items:center}
.empty{text-align:left}
.ico{width:42px;height:42px;border-radius:12px;background:var(--lav);display:grid;place-items:center;color:var(--vi);margin-bottom:14px}
.empty h3{margin-bottom:4px}.empty p{color:var(--muted);margin:0 0 16px}
.tools{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin:18px 0}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px}
.field input,.field select{border:0;background:none;outline:none;width:100%;font-size:16px;min-height:42px}
.wk{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;cursor:pointer}
.wk .ico{margin:0;flex:none}.wk div{flex:1}.wk small{color:var(--muted);font-size:13px}
.back{display:inline-flex;gap:6px;align-items:center;font-weight:500;text-decoration:none;margin-top:12px;min-height:38px;font-size:13.5px}
.dhead{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;margin:6px 0 14px}
.dhead h1{margin:0;font-size:clamp(20px,5.4vw,25px)}
.prog{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 14px}
.sat .prog{background:linear-gradient(var(--peach2),var(--card) 320px);border-color:var(--sb)}
.prog>h2{margin:0 0 4px}
.meter{height:8px;background:var(--lav2);border-radius:9px;overflow:hidden;margin:10px 0 4px}.meter i{display:block;height:100%;background:var(--vibtn);border-radius:9px}
.sec{margin-top:18px;font-size:12px;font-weight:500;color:var(--vi);background:var(--lav);display:inline-block;padding:6px 12px;border-radius:10px}
.sat .sec{color:var(--te);background:var(--peach)}
.part{padding:12px 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.ph{display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px}
.num{font-weight:500;color:var(--vi);font-size:14px}
.sat .num{color:var(--te)}
.ph h3{font-size:14.5px}.ph .dur{color:var(--muted);font-weight:500;font-size:12.5px;white-space:nowrap}
.cons{color:var(--muted);margin:6px 0 0}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.refs a{font-size:12px;font-weight:500;text-decoration:none;background:var(--lav2);padding:6px 10px;border-radius:10px;display:inline-flex;gap:6px;align-items:center}
.inner{margin-left:34px}
.conseils{margin:10px 0 0;padding-left:20px;color:var(--ink)}
.item{margin-top:12px}
.item .q{font-weight:500;display:flex;gap:6px;align-items:flex-start}
.item .q a{flex:none;margin-top:2px}
.item .qq{color:var(--muted);margin:4px 0 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--vi);font-weight:500;list-style:none;min-height:36px;font-size:13.5px;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";transition:transform .15s}details[open]>summary::before{transform:rotate(90deg)}
.pp dt{font-weight:500;font-size:13px;margin-top:9px}.pp dd{margin:2px 0 0;color:var(--muted)}
.say{background:var(--lav);border-radius:14px;padding:12px;margin-top:10px}
.say b{display:block;font-size:13px;margin-bottom:4px}
.acts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.acts a{font-weight:500;text-decoration:none;display:inline-flex;gap:6px;align-items:center;min-height:38px;font-size:13.5px}
.mine{margin-top:12px;border-left:3px solid var(--vibtn);padding:4px 0 4px 12px}
.mine small{color:var(--vi);font-weight:500}
.also{margin-top:14px;background:var(--lav2);border-radius:16px;padding:12px 14px}
.also b{font-size:12.5px}.also a{display:block;font-weight:500;font-size:13px;text-decoration:none;padding:5px 0}
.srcs{background:var(--peach);border-radius:18px;padding:14px 16px;margin:18px 0 40px}
.srcs a{display:flex;justify-content:space-between;gap:10px;font-weight:500;text-decoration:none;padding:6px 0;font-size:13px}
.cm .cmh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cm small{color:var(--muted)}
.cm .txt{margin:10px 0 0;white-space:pre-wrap}
.cm .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cm .row .btn{min-height:38px;padding:0 12px;font-size:13px}
.tag{font-size:11.5px;font-weight:500;border-radius:999px;padding:4px 10px;background:var(--lav);color:var(--vi);white-space:nowrap}
.tag.pret{background:var(--okbg);color:var(--ok)}.tag.idee{background:var(--peach);color:var(--te)}
dialog{border:0;padding:0;border-radius:28px 28px 0 0;width:100%;max-width:760px;margin:auto auto 0;background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:#120e2a88}
@media(min-width:700px){dialog{border-radius:28px;margin:auto}}
.sheet{padding:18px;display:grid;gap:12px}
.sheet h2{margin:0}
.sheet label{font-weight:500;font-size:13px;display:grid;gap:6px}
.sheet textarea,.sheet select,.sheet input{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-size:16px;width:100%}
.sheet textarea{min-height:76px;resize:vertical}
.sheet .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.sheet .end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
@media(max-width:560px){.hero{grid-template-columns:minmax(0,1fr) 112px;padding:14px}.inner{margin-left:0}.tools{grid-template-columns:minmax(0,1fr)}.sheet .two{grid-template-columns:minmax(0,1fr)}.card{padding:18px}}
@media(max-width:400px){nav{gap:0}nav a{padding:7px 8px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
nav a{flex:none}
@media(max-width:430px){nav svg{display:none}nav a{padding:7px 9px}}
.disc{margin-top:12px;background:linear-gradient(var(--lav2),var(--card));border:1.5px solid var(--hb);border-radius:16px;padding:14px}
.disc .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.disc .dh small{color:var(--muted)}
.dplan{margin:10px 0 0;padding-left:20px}.dplan li{margin-top:6px}
.dtxt{white-space:pre-wrap;margin-top:8px;font-size:calc(var(--fs) + 1px);line-height:1.6}
.dlg{background:var(--lav2);border-radius:14px;padding:6px 12px 10px;margin-top:10px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 11px;margin:8px 30px 0 0}
.bub.me{background:var(--lav);border-color:transparent;border-radius:14px 14px 4px 14px;margin:8px 0 0 30px}
.bub small{display:block;font-size:11px;font-weight:600;color:var(--vi)}
.reco{background:var(--okbg);border-radius:14px;padding:12px 14px;margin:14px 0 4px}.reco b{color:var(--ok)}.reco ul{margin:6px 0 0;padding-left:18px}.reco li b{color:var(--ink)}
.tvmode header{display:none}.tvmode{overflow:hidden}
.tv{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at top,#2a2152,#0e0b1c 70%);color:#f4f1ff;display:flex;flex-direction:column;justify-content:center;padding:4vh 6vw}
.tv-card{max-width:1400px;margin:auto 0;width:100%}
.tv-t{font-size:clamp(22px,3.6vw,56px);font-weight:600;letter-spacing:-.02em;line-height:1.15;color:#c9bcff}
.tv-q{font-size:clamp(16px,2.2vw,32px);color:#a8a0c8;margin-top:1.2vh;line-height:1.3}
.tv-x{white-space:pre-wrap;margin-top:3.5vh;line-height:1.45}
.tv-x.tv-l{font-size:clamp(22px,3.4vw,54px)}.tv-x.tv-m{font-size:clamp(18px,2.7vw,42px)}.tv-x.tv-s{font-size:clamp(15px,2.1vw,32px)}
.tv-v{margin-top:3vh;font-size:clamp(16px,2.2vw,34px);color:#ffb28f;font-weight:500}
.tv-foot{position:absolute;left:6vw;right:6vw;bottom:3vh;display:flex;justify-content:space-between;color:#7d76a0;font-size:clamp(12px,1.4vw,20px)}
.tv-nav{position:absolute;top:0;bottom:0;width:30%;background:none;border:0;cursor:pointer}.tv-nav.l{left:0}.tv-nav.r{right:0}
.tv-x-btn{position:absolute;top:2vh;right:2vw;z-index:2;background:#ffffff1a;color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer}
.tvadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tvrow{display:flex;gap:12px;align-items:flex-start}
.tvth{width:88px;height:62px;border-radius:10px;object-fit:cover;background:var(--lav2);flex:none}
.tvth.vid{position:relative;display:grid;place-items:center;overflow:hidden;background:#1b1530}.tvth.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}.tvth.vid span{position:relative;color:#fff;font-size:22px}
.tv-full{position:absolute;inset:0;display:grid;place-items:center;background:#000}
.tv-media{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
.tv-cap{position:absolute;left:0;right:0;top:0;padding:2vh 6vw;font-size:clamp(16px,2vw,30px);background:linear-gradient(#000c,#0000);color:#fff;pointer-events:none}
.tv-card.with-m{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4vw;align-items:center}
.tv-side{width:100%;max-height:70vh;object-fit:contain;border-radius:16px;background:#000}
.tv-arrows{display:flex;gap:10px}.tv-arrows button{background:#ffffff26;color:#fff;border:0;border-radius:999px;width:48px;height:48px;font-size:26px;cursor:pointer}
.tv-foot{z-index:3}
@media(max-aspect-ratio:1/1){.tv-card.with-m{grid-template-columns:minmax(0,1fr)}}
.jwtabs{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto}.jwtabs button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:500;cursor:pointer;white-space:nowrap}.jwtabs button.on{background:var(--vibtn);color:#fff;border-color:transparent}
.jwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.jwcat{position:relative;border:0;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#2a2446;color:#fff;cursor:pointer;padding:0}.jwcat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}.jwcat span{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-weight:600;font-size:13px;text-align:left;background:linear-gradient(#0000,#000c)}
.jwvids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.jwv{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.jwp{position:relative;aspect-ratio:16/9;background:#1b1530}.jwp img{width:100%;height:100%;object-fit:cover;display:block}.jwp span{position:absolute;right:8px;bottom:8px;background:#000b;color:#fff;font-size:12px;border-radius:6px;padding:2px 6px}
.jwb{padding:10px 12px 12px}.jwb h3{font-size:14px}.jwb small{color:var(--muted)}.jwb .btn{min-height:36px;padding:0 10px;font-size:13px}
.tv-arrows .tv-ap{width:auto;padding:0 16px;font-size:15px;font-weight:600}
.bref{color:var(--vi);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:500;font-size:13px;cursor:pointer}.chips button.on{background:var(--vibtn);color:#fff;border-color:transparent}
.cfc.cur{border-color:var(--vibtn);box-shadow:0 0 0 3px var(--lav)}
.cfh h1{margin:6px 0 4px}.cfobj{background:var(--lav);border-radius:14px;padding:10px 12px;margin:10px 0 0;font-weight:500}
.cfact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cfsteps{list-style:none;padding:0;margin:8px 0 0}.cfsteps li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.cfsteps li:last-child{border:0}
.cfm{background:var(--lav2);color:var(--vi);border-radius:8px;font-size:12px;font-weight:600;text-align:center;padding:4px 0;align-self:start}
.lnk{border:0;background:none;color:var(--vi);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
@media print{header,nav,.btn,.row,.cfact,.chips,.toast,.back,button,#cfnote{display:none!important}body{background:#fff!important;color:#000!important}.card,.prog{border:1px solid #bbb!important;box-shadow:none!important;break-inside:avoid}a{color:#000}}
.vhead small{color:var(--vi);font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}.vhead h2{margin:2px 0 0}
.vtext{display:grid;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px}
.vv{display:flex!important;gap:10px;align-items:flex-start;font-weight:400!important;font-family:Georgia,"Times New Roman",serif;font-size:calc(var(--fs) + 3px);line-height:1.55}
.vv input{width:auto!important;margin-top:6px;accent-color:var(--vibtn)}.vv sup{color:var(--vi);font-family:system-ui;font-weight:700;font-size:.7em}
.vact{display:flex;gap:8px;flex-wrap:wrap}
.chips button[data-vth]{font-weight:600}.chips button[data-vth].on{outline:3px solid var(--vi);outline-offset:2px}
.medias{display:grid;gap:8px;margin-top:10px}
.md{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;background:var(--lav2);border-radius:12px;padding:10px 12px}
.sat .md{background:var(--peach2)}
.md .mdi{font-size:16px;line-height:1.4}.md b{font-size:13px}.md p{margin:2px 0 4px;color:var(--muted)}.md a{font-size:12.5px;font-weight:500;text-decoration:none}
textarea.big,#tform textarea,#tform input,#tform select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-size:16px}
#tform textarea.big{min-height:140px;resize:vertical;margin-top:8px}
.sec-ed{padding:12px;display:grid;gap:8px}.sec-ed textarea{min-height:64px}
.clock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.clock>div{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.clock small{display:block;color:var(--muted);font-size:11.5px}.clock b{font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
.tbar{height:8px;background:var(--lav2);border-radius:9px;overflow:hidden}.tbar i{display:block;height:100%;width:0;background:var(--vibtn);transition:width .25s}
.train .lc.now{border-color:var(--vibtn);box-shadow:0 0 0 3px var(--lav)}
.train .lc.done{opacity:.5}
/* ---- v2 : mode réunion, taille du texte, prochaine réunion ---- */
.tag.dit{background:var(--lav2);color:var(--muted)}
.fsz{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.fsz button{border:0;background:var(--card);min-height:36px;min-width:38px;font-weight:600;cursor:pointer;color:var(--ink)}
.fsz button+button{border-left:1.5px solid var(--line)}
.next{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--hb)}
.next b{font-size:14px}.next small{display:block;color:var(--muted);font-size:12px}
.foot .btns{display:flex;gap:8px;flex-wrap:wrap}
.live .lc{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.live .lc.done{opacity:.55}
.live .lp{font-size:12px;font-weight:600;color:var(--vi);text-transform:uppercase;letter-spacing:.04em}
.live.sat .lp{color:var(--te)}
.live .lq{color:var(--muted);margin:6px 0 10px}
.live .ld{font-size:calc(var(--fs) * 1.55);line-height:1.5;margin:0;white-space:pre-wrap}
.live .lv{margin-top:10px;font-weight:500;color:var(--vi)}
.live .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.live .lact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.draft{background:var(--peach);color:var(--te);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:500}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg></div><b>Carnet de réunions</b><span class="fsz" role="group" aria-label="Taille du texte"><button type="button" data-fs="-1" aria-label="Réduire le texte">A−</button><button type="button" data-fs="1" aria-label="Agrandir le texte">A+</button></span><button class="theme" id="theme" type="button" aria-label="Changer de thème"></button></div>
  <nav aria-label="Navigation">
    <a href="#semaine" data-nav="semaine"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15h2M14 15h2"/></svg>Ma semaine</a>
    <a href="#commentaires" data-nav="commentaires"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l1.4-3.6A8 8 0 1 1 8.6 19z"/><path d="M9 10h6M9 13.5h4"/></svg>Commentaires</a>
    <a href="#historique" data-nav="historique"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.4-5.9L3.5 8.5"/><path d="M3.5 4v4.5H8M12 8v4.5l3 2"/></svg>Historique</a>
    <a href="#discours" data-nav="discours"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Discours</a>
    <a href="#culte" data-nav="culte"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Culte</a>
    <a href="#diffuser" data-nav="diffuser"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Diffuser</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<dialog id="dlg"><form class="sheet" id="form" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){ // fonction auto-exécutée : évite un bug de Safari 15 avec les fonctions dans un bloc { }
const OFFLINE = false;
const WEEKS = {};
let TALKS = [], COMMENTS = [], DB = null, UID = null, MODE = 'local', curWeek = null;
const LS = 'carnet-commentaires', LSW = 'carnet-semaine';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MC = ['JANV','FÉVR','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const ext = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const cal = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15h2M14 15h2"/></svg>';
const bub = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l1.4-3.6A8 8 0 1 1 8.6 19z"/><path d="M9 10h6M9 13.5h4"/></svg>';
const book = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>';
const plus = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

function sortedWeeks(){ return Object.values(WEEKS).sort((a,b) => a.debut < b.debut ? -1 : 1); }
function pickWeek(){
  if (curWeek && WEEKS[curWeek]) return WEEKS[curWeek];
  const ws = sortedWeeks(), t = today();
  let saved = null; try { saved = localStorage.getItem(LSW); } catch(e){}
  const now = ws.find(w => pd(w.debut) <= t && t <= pd(w.fin));
  const next = ws.find(w => pd(w.debut) > t);
  // à partir du dimanche soir, la semaine suivante est mise en avant si elle est prête
  const sundayEve = t.getDay() === 0 && new Date().getHours() >= 19;
  const w = (sundayEve && next) || now || next || ws[ws.length-1];
  curWeek = (saved && WEEKS[saved] && !now) ? saved : w.id;
  return WEEKS[curWeek];
}
function setWeek(id){ curWeek = id; try { localStorage.setItem(LSW, id); } catch(e){} }
function allParts(w, key){ const out = []; (w.reunions[key].sections||[]).forEach(s => s.parties.forEach(p => out.push(p))); return out; }
function partKey(p){ return (p.num || '') + '|' + p.titre; }
function forMeeting(wid, key){ return COMMENTS.filter(c => c.weekId === wid && c.meeting === key); }
function dLabel(s){ const d = pd(s); return d.getDate() + ' ' + MOIS[d.getMonth()]; }
function rel(s){ const n = Math.round((pd(s) - today()) / 864e5);
  return n === 0 ? "aujourd'hui" : n === 1 ? 'demain' : n > 1 ? 'dans ' + n + ' jours' : n === -1 ? 'hier' : 'il y a ' + (-n) + ' jours'; }
// ordre des parties dans le programme (pour trier les commentaires comme à la réunion)
function partOrder(w, k){ const o = {}; allParts(w,k).forEach((p,i) => o[partKey(p)] = i); return o; }
function nextMeeting(){
  const t = today(); let best = null;
  Object.values(WEEKS).forEach(w => ['mercredi','samedi'].forEach(k => { const m = w.reunions[k]; if (!m) return;
    const d = pd(m.date); if (d >= t && (!best || d < best.d)) best = {w, k, m, d}; }));
  return best;
}
const existingTake = (wid, k, pk, j) => COMMENTS.find(c => c.weekId === wid && c.meeting === k && c.partKey === pk && c.item === j);
// estimation de la durée à l'oral (~2,5 mots par seconde)
const oral = t => Math.round(String(t||'').trim().split(/\s+/).filter(Boolean).length / 2.5);

/* ---------- vues ---------- */
function vSemaine(){
  const w = pickWeek(), ws = sortedWeeks(), i = ws.findIndex(x => x.id === w.id);
  const mine = COMMENTS.filter(c => c.weekId === w.id);
  return `<h1>Ma semaine</h1><p class="sub">Prépare tes réunions et retrouve tes commentaires au même endroit.</p>
  <div class="weeknav"><button aria-label="Semaine précédente" data-wk="${ws[i-1]?.id||''}" ${i<=0?'disabled':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span><span style="color:var(--vi)">${cal}</span>${esc(w.court)}</span>
  <button aria-label="Semaine suivante" data-wk="${ws[i+1]?.id||''}" ${i>=ws.length-1?'disabled':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <section class="hero"><div><span class="pill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Chaque dimanche à 19 h</span>
  <h2>Prépare tes deux réunions</h2><p>Retrouve les sujets du mercredi et du samedi pour commencer à réfléchir dès le début de la semaine.</p>
  ${w.prepareLe ? `<div class="ready">✓ Semaine préparée le ${esc(dLabel(w.prepareLe))}</div>` : ''}</div>${art()}
  ${(() => { const nx = nextMeeting(); if (!nx) return ''; const n = forMeeting(nx.w.id, nx.k).length;
    return `<div class="next" style="grid-column:1/-1"><div><small>Prochaine réunion · ${esc(rel(nx.m.date))}</small><b>${esc(nx.m.jour)} ${esc(dLabel(nx.m.date))} · ${n} commentaire${n>1?'s':''} prêt${n>1?'s':''}</b></div>
    <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#${nx.k}" data-go="${esc(nx.w.id)}">Préparer</a>${n ? `<a class="btn pri" href="#live-${nx.k}" data-go="${esc(nx.w.id)}">Mode réunion</a>` : ''}</div></div>`; })()}</section>
  ${draftBanner()}${installCard()}
  <div class="rowhead"><h2>Les réunions</h2><a href="${esc(w.programme)}" target="_blank" rel="noopener">Voir le programme ${ext}</a></div>
  ${['mercredi','samedi'].map(k => meetCard(w,k)).join('')}
  <h2>Mes commentaires</h2><p class="sub">Pour la semaine du ${esc(w.court)}.</p>
  ${mine.length ? mine.map(cmCard).join('') : emptyCard()}`;
}
function meetCard(w, k){
  const m = w.reunions[k]; if (!m) return '';
  const d = pd(m.date), n = forMeeting(w.id,k).length, past = d < today();
  const st = past ? (n ? `<span class="status ok">● Préparée</span>` : `<span class="status">● Passée</span>`) : (n ? `<span class="status ok">● ${n} prêt${n>1?'s':''}</span>` : `<span class="status">● À préparer</span>`);
  return `<article class="card ${k==='samedi'?'sat':''}"><div class="meet">
    <div class="tile"><div><b>${d.getDate()}</b><small>${MC[d.getMonth()]}</small></div></div>
    <div><div class="top"><h3 style="font-size:15px">Réunion du ${k}</h3>${st}</div><p class="meta">${esc(dLabel(m.date))} · ${esc(m.type)}</p></div>
    <div class="focus"><span style="color:${k==='samedi'?'var(--te)':'var(--vi)'}">${book}</span><div><small>${esc(m.focusLabel)}</small><b>${esc(m.focus)}</b></div></div>
    <div class="foot"><span>${bub.replace('24','18').replace('24','18')} ${n} commentaire${n>1?'s':''}${past ? '' : ` · ${esc(rel(m.date))}`}</span><span class="btns">${n ? `<a class="btn" href="#live-${k}">Mode réunion</a>` : ''}<a class="btn ${k==='samedi'?'te':'pri'}" href="#${k}">Ouvrir la fiche →</a></span></div>
  </div></article>`;
}
function emptyCard(){
  return `<div class="card empty"><div class="ico">${bub}</div><h3>Aucun commentaire pour le moment</h3><p>Commence par noter une idée que tu aimerais partager.</p><button class="btn" data-new>${plus} Ajouter</button></div>`;
}
function vCommentaires(){
  return `<h1>Mes commentaires</h1><p class="sub">Retrouve tes idées, tes brouillons et tes réponses prêtes à partager.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-new>${plus} Nouveau commentaire</button><button class="btn" data-export>Exporter</button><button class="btn" data-import>Importer</button></div>
  ${OFFLINE ? '<p class="note">Version hors connexion : tes commentaires sont gardés sur ce téléphone. Utilise Exporter / Importer pour les transférer vers l\'application en ligne.</p>' : ''}
  <div class="tools"><label class="field"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--vi)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Rechercher un commentaire" aria-label="Rechercher"></label>
  <label class="field"><select id="fm" aria-label="Filtrer"><option value="">Toutes les réunions</option><option value="mercredi">Réunions du mercredi</option><option value="samedi">Réunions du samedi</option><option value="pret">Prêts à dire</option><option value="brouillon">Brouillons</option><option value="idee">Idées</option><option value="dit">Déjà dits</option></select></label></div>
  <div id="list"></div>`;
}
function fillList(){
  const el = $('#list'); if (!el) return;
  const q = ($('#q')?.value || '').toLowerCase(), f = $('#fm')?.value || '';
  const L = COMMENTS.filter(c => (!f || c.meeting === f || c.statut === f) && (!q || JSON.stringify(c).toLowerCase().includes(q)))
    .sort((a,b) => (b.updated||0) - (a.updated||0));
  el.innerHTML = L.length ? L.map(cmCard).join('') : (COMMENTS.length ? `<p class="sub">Aucun résultat.</p>` : emptyCard());
}
const ST = {pret:'Prêt à dire', brouillon:'Brouillon', idee:'Idée', dit:'Dit ✓'};
function cmCard(c){
  const w = WEEKS[c.weekId], m = w?.reunions?.[c.meeting];
  return `<article class="card cm"><div class="cmh"><div><h3>${esc(c.partLabel || 'Commentaire libre')}</h3><small>Réunion du ${esc(c.meeting)}${m ? ' · ' + esc(dLabel(m.date)) : ''}</small></div><span class="tag ${esc(c.statut)}">${esc(ST[c.statut]||'Brouillon')}</span></div>
  ${c.dire ? `<p class="txt">${esc(c.dire)}</p>` : ''}
  <details><summary>Voir la structure</summary><dl class="pp">
  ${c.reponse?`<dt>Réponse directe</dt><dd>${esc(c.reponse)}</dd>`:''}${c.verset?`<dt>Verset ou publication</dt><dd>${bl(c.verset)}</dd>`:''}${c.probleme?`<dt>Problème ou difficulté</dt><dd>${esc(c.probleme)}</dd>`:''}${c.application?`<dt>Application ou leçon</dt><dd>${esc(c.application)}</dd>`:''}</dl></details>
  <div class="row"><button class="btn soft" data-edit="${esc(c.id)}">Modifier</button><button class="btn" data-copy="${esc(c.id)}">Copier</button><button class="btn" data-tvc="${esc(c.id)}" title="Diffuser sur la télé">📺</button><button class="btn" data-del="${esc(c.id)}" style="color:var(--te)">Supprimer</button></div></article>`;
}
function vHistorique(){
  const ws = sortedWeeks().reverse();
  return `<h1>Historique</h1><p class="sub">Reviens aux réunions passées et à tes commentaires.</p>
  <a class="btn" href="#semaine" style="margin-bottom:18px">${cal} Ma semaine</a><div style="height:16px"></div>
  ${ws.map(w => { const n = COMMENTS.filter(c => c.weekId === w.id).length;
    return `<a class="card wk" href="#semaine" data-go="${esc(w.id)}"><span class="ico">${cal}</span><div><h3>${esc(w.label)}</h3><small>${n} commentaire${n>1?'s':''}</small></div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--vi)" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>`; }).join('')}
  <p class="note">Une nouvelle semaine s'ajoute chaque dimanche soir.</p>`;
}
function vDetail(k){
  const w = pickWeek(), m = w.reunions[k], d = pd(m.date), mine = forMeeting(w.id,k);
  const parts = allParts(w,k).filter(p => p.items?.length), done = parts.filter(p => mine.some(c => c.partKey === partKey(p))).length;
  return `<div class="${k==='samedi'?'sat':''}"><a class="back" href="#semaine">← Retour à la semaine</a>
  <div class="dhead"><div class="tile"><div><b>${d.getDate()}</b><small>${MC[d.getMonth()]}</small></div></div><div><h1>Réunion du ${k}</h1><p class="meta">${k[0].toUpperCase()+k.slice(1)} ${esc(dLabel(m.date))} ${d.getFullYear()} · ${esc(m.type)}</p></div></div>
  <section class="prog"><h2>Programme et préparation</h2>
  <p class="meta">${m.intro ? esc(m.intro) : `Lecture biblique : <a href="${esc(m.focusUrl)}" target="_blank" rel="noopener">${esc(m.focus)}</a>`}</p>
  ${parts.length ? `<div class="meter" aria-hidden="true"><i style="width:${Math.round(done/parts.length*100)}%"></i></div><p class="note">${done} partie${done>1?'s':''} sur ${parts.length} avec ton commentaire</p>` : ''}
  ${m.recommandations?.length ? `<div class="reco"><b>⭐ Les commentaires que je privilégierais</b><ul>${m.recommandations.map(r => `<li><b>${esc(r.titre)}</b> — ${esc(r.raison)}</li>`).join('')}</ul></div>` : ''}
  ${m.sections.map(s => `<div class="sec">${esc(s.titre)}</div>${s.parties.map(p => partHtml(w,k,p,mine)).join('')}`).join('')}
  </section>
  <div class="srcs"><h3 style="margin-bottom:6px">Sources principales</h3>${m.sources.map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener"><span>${esc(s.t)}</span>${ext}</a>`).join('')}</div></div>`;
}
function partHtml(w,k,p,mine){
  const pk = partKey(p), my = mine.filter(c => c.partKey === pk);
  return `<div class="part"><div class="ph"><span class="num">${esc(p.num ? (/^\d+$/.test(p.num) ? p.num + '.' : p.num) : '♪')}</span><div><h3>${esc(p.titre)} ${p.duree ? `<span class="dur">· ${esc(p.duree)}</span>` : ''}</h3>
  ${p.consigne ? `<p class="cons">${bl(p.consigne)}</p>` : ''}
  ${p.refs?.length ? `<div class="refs">${p.refs.map(r => `<a href="${esc(refURL(r))}" target="_blank" rel="noopener">${esc(r.t)} ${ext}</a>`).join('')}</div>` : ''}</div></div>

/* ---------- rendu et routage ---------- */
function route(){ const h = location.hash.slice(1); return ['commentaires','historique','mercredi','samedi','live-mercredi','live-samedi','discours','diffuser','tv','tv-recv','jw','culte'].includes(h) || /^culte-[\w-]+$/.test(h) || /^talk-(edit|train)-[\w-]+$/.test(h) ? h : 'semaine'; }
function render(keepScroll){
  const r = route(), y = scrollY, live = r.startsWith('live-');
  const needWeeks = !['commentaires','discours','diffuser','tv','tv-recv','jw','culte'].includes(r) && !r.startsWith('culte-') && !r.startsWith('talk-');
  if (needWeeks && !Object.keys(WEEKS).length){
    $('#app').innerHTML = LOADERR
      ? `<div class="card" style="margin-top:18px"><h3>Programmes indisponibles</h3><p class="note">Connecte-toi une fois à Internet pour télécharger les programmes. Tes commentaires et tes discours restent accessibles.</p><a class="btn" href="#discours">Mes discours</a></div>`
      : `<p class="sub" style="margin-top:24px">Chargement des programmes…</p>`;
    return;
  }
  document.querySelectorAll('[data-nav]').forEach(a => a.toggleAttribute('aria-current', a.dataset.nav === r || (r==='mercredi'||r==='samedi'||live) && a.dataset.nav==='semaine' || r.startsWith('talk-') && a.dataset.nav==='discours' || (r==='jw'||r==='tv') && a.dataset.nav==='diffuser' || r.startsWith('culte-') && a.dataset.nav==='culte'));
  document.querySelectorAll('[data-nav]').forEach(a => a.hasAttribute('aria-current') ? a.setAttribute('aria-current','page') : 0);
  const open = [...document.querySelectorAll('details[open]')].map(d => d.querySelector('summary')?.parentElement?.closest('.item')?.querySelector('.q')?.textContent);
  const qv = $('#q')?.value, fv = $('#fm')?.value;
  $('#app').innerHTML = r==='commentaires' ? vCommentaires() : r==='historique' ? vHistorique() : (r==='mercredi'||r==='samedi') ? vDetail(r) : live ? vLive(r.slice(5)) : r==='discours' ? vTalks() : r==='diffuser' ? vDiffuser() : r==='jw' ? vJW() : r==='culte' ? vCulte() : r.startsWith('culte-') ? vCulteDetail(r.slice(6)) : (r==='tv'||r==='tv-recv') ? vTV() : r.startsWith('talk-edit-') ? vTalkEdit(r.slice(10)) : r.startsWith('talk-train-') ? vTalkTrain(r.slice(11)) : vSemaine();
  if (r.startsWith('talk-edit-')) afterTalkEdit(r.slice(10));
  if (r.startsWith('talk-train-')) startTrain(r.slice(11)); else stopTrain();
  wakeLock(live || r.startsWith('talk-train-') || r==='tv' || r==='tv-recv');
  if (r==='tv' || r==='tv-recv') tvEnter(); else tvLeave();
  if (r==='diffuser') hydrate($('#app'));
  if (r==='jw') afterJW();
  if (r==='commentaires'){ if (qv) $('#q').value = qv; if (fv) $('#fm').value = fv; fillList(); }
  if (keepScroll){ document.querySelectorAll('.item').forEach(it => { if (open.includes(it.querySelector('.q')?.textContent)) it.querySelector('details')?.setAttribute('open',''); }); scrollTo(0,y); }
}
addEventListener('hashchange', () => { render(); scrollTo(0,0); });

/* ---------- stockage ---------- */
function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e){ return []; } }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(COMMENTS)); } catch(e){} }
// silent = true : pas de sauvegarde ni de rendu (utilisé pour les imports groupés)
async function persist(c, del, silent){
  if (!c) return;
  if (MODE === 'db'){
    try { const ref = DB.collection('data/users/' + UID).doc(c.id); del ? await ref.delete() : await ref.set(c); return; }
    catch(e){ toast('Enregistré sur ce téléphone seulement'); MODE = 'local'; }
  }
  if (del) COMMENTS = COMMENTS.filter(x => x.id !== c.id); else { const i = COMMENTS.findIndex(x => x.id === c.id); i < 0 ? COMMENTS.push(c) : COMMENTS[i] = c; }
  if (!silent){ saveLocal(); render(true); }
}
/* brouillon de l'éditeur : rien n'est perdu si l'appli se ferme pendant la saisie */
const LSD = 'carnet-brouillon';
function getDraft(){ try { return JSON.parse(localStorage.getItem(LSD) || 'null'); } catch(e){ return null; } }
function setDraft(d){ try { d ? localStorage.setItem(LSD, JSON.stringify(d)) : localStorage.removeItem(LSD); } catch(e){} }
function dropDraft(id){ if (getDraft()?.id === id) setDraft(null); }

  const dlg = $('#dlg'), form = $('#form');

  const snap = () => { const f = new FormData(form); return {...c, _draft: 1, part: f.get('part'), statut: f.get('statut'), reponse: f.get('reponse'), verset: f.get('verset'), probleme: f.get('probleme'), application: f.get('application'), dire: f.get('dire')}; };
  const showOral = () => { const s = oral(form.elements.dire.value); $('#oral').innerHTML = s ? `≈ ${s} s à l'oral${s > 30 ? ' · <span style="color:var(--te)">un commentaire de 30 s maximum est idéal</span>' : ''}` : ''; };
  // si on reprend un brouillon, on restaure aussi la partie choisie

/* lecture des fichiers PDF / Word dans le navigateur (bibliothèques chargées à la demande, gardées hors connexion) */
const LIBS = {pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js', pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js', docx:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'};
const loadLib = src => new Promise((ok, ko) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
async function fileText(file){
  const name = file.name.toLowerCase(), buf = await file.arrayBuffer();
  if (name.endsWith('.pdf')){
    await loadLib(LIBS.pdf);
    // Safari refuse un « worker » venant d'un autre site : on le charge en local (blob)
    if (!String(pdfjsLib.GlobalWorkerOptions.workerSrc).startsWith('blob:')){ try { const w = await (await fetch(LIBS.pdfw)).blob(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(w); } catch(e){ pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfw; } }
    const pdf = await pdfjsLib.getDocument({data: buf}).promise; let out = [];
    for (let i = 1; i <= pdf.numPages; i++){
      const c = await (await pdf.getPage(i)).getTextContent(); let line = '', lastY = null;
      c.items.forEach(it => { const y = it.transform[5]; if (lastY !== null && Math.abs(y - lastY) > 2){ out.push(line); line = ''; } line += it.str; lastY = y; });
      out.push(line, '');
    }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  if (name.endsWith('.docx')){ await loadLib(LIBS.docx); return (await mammoth.extractRawText({arrayBuffer: buf})).value.replace(/\n{3,}/g, '\n\n').trim(); }
  if (name.endsWith('.doc')) throw new Error('Ancien format .doc : enregistre-le en .docx ou en PDF');
  return new TextDecoder().decode(buf).trim();
}

function guessTitle(txt, fname){
  const l = txt.split('\n').map(x => x.trim()).filter(x => x.length > 3 && x.length < 120);
  const q = l.find(x => /[«“"].+[»”"]/.test(x)) || l[0];
  return (q || fname.replace(/\.[^.]+$/, '')).replace(/^\d+\s*[.\-–]\s*/, '');
}
// découpe un plan en parties : titres en majuscules, chiffres romains, numéros, ou mentions « (5 min) »
function splitPlan(txt, total){
  const lines = txt.split('\n').map(x => x.trim()).filter(Boolean), out = [];
  const isHead = x => /\(\s*\d+(?:[.,]\d+)?\s*min/i.test(x) || /^(?:[IVX]+|\d{1,2})[.)]\s+\S/.test(x) || (x.length < 90 && x.length > 5 && x === x.toUpperCase() && /[A-ZÀ-Ý]/.test(x));
  lines.forEach(x => {
    if (isHead(x) || !out.length){ const m = x.match(/\(\s*(\d+(?:[.,]\d+)?)\s*min/i);
      out.push({titre: x.replace(/\(\s*\d+(?:[.,]\d+)?\s*min[^)]*\)/i, '').trim(), min: m ? +m[1].replace(',', '.') : 0, notes: ''}); }
    else out[out.length-1].notes += (out[out.length-1].notes ? '\n' : '') + x;
  });
  if (out.length > 1 && /^[«“"]|^thème/i.test(out[0].titre) && !out[0].notes) out.shift();
  // répartit le temps restant entre les parties sans durée
  const known = out.reduce((a,x) => a + x.min, 0), free = out.filter(x => !x.min);
  if (free.length){ const each = Math.max(0.5, Math.round((Math.max(0, total - known) / free.length) * 2) / 2); free.forEach(x => x.min = each); }
  return out.slice(0, 30);
}

/* téléchargement avec pourcentage d'avancement */
async function fetchBlob(url, label){
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !r.body.getReader) return r.blob();
  const rd = r.body.getReader(), parts = []; let got = 0, last = 0;
  for (;;){ const {done, value} = await rd.read(); if (done) break; parts.push(value); got += value.length;
    if (Date.now() - last > 700){ last = Date.now(); toast('⬇ ' + (label || '') + ' ' + (total ? Math.round(got / total * 100) + ' %' : Math.round(got / 1048576) + ' Mo') + ' · garde l\'appli ouverte'); } }
  return new Blob(parts, {type: r.headers.get('content-type') || 'video/mp4'});
}
/* --- import de fichiers : images, vidéos, PDF, PowerPoint --- */
async function importMediaFiles(files){
  let n = 0;
  for (const f of files){
    const name = f.name.replace(/\.[^.]+$/, ''), low = f.name.toLowerCase();
    try {
      if (f.type.startsWith('image/')){ tvAdd({titre: name, media: {type: 'image', ref: await storeFile(f)}, full: 1}, true); n++; }
      else if (f.type.startsWith('video/')){ tvAdd({titre: name, media: {type: 'video', ref: await storeFile(f)}}, true); n++; }
      else if (low.endsWith('.pdf')) n += await importPdfSlides(f, name);
      else if (low.endsWith('.pptx')) n += await importPptx(f, name);
      else if (low.endsWith('.ppt') || low.endsWith('.key')) toast('Format ancien : enregistre la présentation en PDF (ou en .pptx)');
    } catch(e){ toast('Erreur avec ' + f.name); }
  }
  if (n){ toast('📺 ' + n + ' diapo' + (n > 1 ? 's' : '') + ' ajoutée' + (n > 1 ? 's' : '')); render(true); }
}
async function importPdfSlides(f, name){
  toast('Conversion des pages…');
  await loadLib(LIBS.pdf);
  if (!String(pdfjsLib.GlobalWorkerOptions.workerSrc).startsWith('blob:')){ try { const w = await (await fetch(LIBS.pdfw)).blob(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(w); } catch(e){ pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfw; } }
  const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise; let n = 0;
  for (let i = 1; i <= Math.min(pdf.numPages, 120); i++){
    const pg = await pdf.getPage(i), v0 = pg.getViewport({scale: 1}), sc = Math.min(3, 1920 / v0.width), vp = pg.getViewport({scale: sc});
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await pg.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .88));
    tvAdd({titre: name + ' · ' + i + '/' + pdf.numPages, media: {type: 'image', ref: await storeFile(blob)}, full: 1, deck: name}, true); n++;
  }
  return n;
}
const LIBZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
async function importPptx(f, name){
  toast('Lecture du PowerPoint…'); await loadLib(LIBZIP);
  const zip = await JSZip.loadAsync(await f.arrayBuffer()), P = new DOMParser();
  const xml = async p => { const z = zip.file(p); return z ? P.parseFromString(await z.async('string'), 'application/xml') : null; };
  const rels = async p => { const d = await xml(p); const m = {}; d && [...d.getElementsByTagName('Relationship')].forEach(r => m[r.getAttribute('Id')] = r.getAttribute('Target')); return m; };
  const pres = await xml('ppt/presentation.xml'), prel = await rels('ppt/_rels/presentation.xml.rels');
  const order = pres ? [...pres.getElementsByTagNameNS('*', 'sldId')].map(s => prel[s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')]).filter(Boolean) : [];
  const paths = order.length ? order.map(t => 'ppt/' + t.replace(/^\/?ppt\//, '').replace(/^\.\.\//, '')) : Object.keys(zip.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
  let n = 0;
  for (const [idx, path] of paths.entries()){
    const d = await xml(path); if (!d) continue;
    const paras = [...d.getElementsByTagNameNS('*', 'p')].map(p => [...p.getElementsByTagNameNS('*', 't')].map(t => t.textContent).join('')).filter(t => t.trim());
    const sr = await rels(path.replace(/slides\/(slide\d+\.xml)$/, 'slides/_rels/$1.rels'));
    const used = [...d.getElementsByTagNameNS('*', 'blip')].map(b => b.getAttribute('r:embed') || b.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'embed'));
    const vids = Object.values(sr).filter(t => /\.(mp4|m4v|mov|webm)$/i.test(t));
    let media = null;
    const tgt = t => 'ppt/' + t.replace(/^\.\.\//, '');
    if (vids.length){ const z = zip.file(tgt(vids[0])); if (z) media = {type: 'video', ref: await storeFile(await z.async('blob'))}; }
    if (!media){ const imgT = used.map(r => sr[r]).find(t => t && /\.(png|jpe?g|gif|webp)$/i.test(t)); if (imgT){ const z = zip.file(tgt(imgT)); if (z){ const b = await z.async('blob'); media = {type: 'image', ref: await storeFile(new Blob([b], {type: /png$/i.test(imgT) ? 'image/png' : 'image/jpeg'}))}; } } }
    tvAdd({titre: paras[0] || name + ' · ' + (idx + 1), texte: paras.slice(1).join('\n'), media, deck: name}, true); n++;
  }
  if (n) toast('PowerPoint importé : pour garder exactement le design, exporte-le plutôt en PDF');
  return n;
}

/* envoi direct vers un Chromecast (Chrome Android, API Presentation) : diapos texte */
let PCONN = null;
function tvSync(){ try { if (PCONN && PCONN.state === 'connected') PCONN.send(JSON.stringify({slides: TVL.map(s => s.media?.ref ? {...s, media: null} : s), i: TVI})); } catch(e){} }
async function tvCast(){
  try {
    const req = new PresentationRequest([location.href.split('#')[0] + '#tv-recv']);
    PCONN = await req.start();
    PCONN.onconnect = () => { tvSync(); toast('📡 Connecté à la télé'); };
    if (PCONN.state === 'connected') tvSync();
    location.hash = 'tv';
  } catch(e){ toast(e && e.name === 'NotAllowedError' ? 'Diffusion annulée' : 'Ta télé ne permet pas l\'envoi direct : utilise la recopie d\'écran'); }
}
if (navigator.presentation && navigator.presentation.receiver){
  navigator.presentation.receiver.connectionList.then(list => {
    const on = c => c.addEventListener('message', ev => { try { const m = JSON.parse(ev.data); TVL = m.slides || []; TVI = m.i || 0; if (location.hash !== '#tv') location.hash = 'tv'; else tvShow(); } catch(e){} });
    list.connections.forEach(on); list.onconnectionavailable = ev => on(ev.connection);
  }).catch(() => {});
}

const BALIAS = {};

function bibleLinks(html){
  return String(html || '').replace(BRE, (all, pre, bk, ch, v, rest, more) => {

  // texte : taille automatique pour remplir la zone
  const maxW = 860, top = 330, bottom = 1040; let size = 72, lines, lh;
  for (; size >= 28; size -= 2){ x.font = `${size}px Georgia, "Times New Roman", serif`; lines = wrapLines(x, text, maxW); lh = size * 1.42; if (lines.length * lh <= bottom - top) break; }
  x.fillStyle = T.ink; const y0 = top + (bottom - top - lines.length * lh) / 2 + size;
  lines.forEach((l, i) => x.fillText(l, W / 2, y0 + i * lh));
  x.fillStyle = T.acc; x.fillRect(W / 2 - 50, 1095, 100, 4);
  x.fillStyle = T.ink; x.font = '700 46px -apple-system, system-ui, "Segoe UI", sans-serif'; x.fillText(ref, W / 2, 1170);
  x.fillStyle = T.sub; x.font = '500 28px -apple-system, system-ui, "Segoe UI", sans-serif'; x.fillText('jw.org', W / 2, 1240);
  return c;
}
let VCANVAS = null;
function cardDialog(){
  const ref = selCitation(), text = selText();
  if (!text) return toast('Choisis au moins un verset');
  const paint = () => { VCANVAS = drawCard(text, ref, VTHEME); $('#vprev').src = VCANVAS.toDataURL('image/jpeg', .85);
    document.querySelectorAll('[data-vth]').forEach(b => b.classList.toggle('on', b.dataset.vth === VTHEME)); };
  $('#form').innerHTML = `<h2>Carte · ${esc(ref)}</h2><img id="vprev" alt="Aperçu de la carte" style="width:100%;border-radius:16px;box-shadow:0 10px 30px #0003">
   <div class="chips">${Object.entries(THEMES).map(([k, t]) => `<button type="button" data-vth="${k}" style="background:linear-gradient(135deg,${t.bg.join(',')});color:${t.ink};border-color:transparent">${t.n}</button>`).join('')}</div>
   <div class="vact"><button class="btn pri" type="button" data-vshare>📤 Partager</button><button class="btn" type="button" data-vsave>⬇ Enregistrer l'image</button></div>
   <div class="end"><button class="btn" type="button" data-vback>← Retour au verset</button><button class="btn" value="cancel">Fermer</button></div>`;
  $('#form').oninput = null; $('#form').onsubmit = null;
  paint(); $('#form').onclick = e => { const b = e.target.closest('[data-vth]'); if (b){ VTHEME = b.dataset.vth; try { localStorage.setItem('carnet-vtheme', VTHEME); } catch(_){} paint(); } };
}
try { VTHEME = localStorage.getItem('carnet-vtheme') || 'aube'; if (!THEMES[VTHEME]) VTHEME = 'aube'; } catch(e){}
async function shareCard(){
  const ref = selCitation(), blob = await new Promise(r => VCANVAS.toBlob(r, 'image/png')), file = new File([blob], ref.replace(/[^\wÀ-ÿ]+/g, '-') + '.png', {type: 'image/png'});
  const data = {files: [file], title: ref, text: ref + ' — lire sur jw.org : ' + VSEL.url};
  try { if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share(data); return; } } catch(e){ if (e.name === 'AbortError') return; }
  saveCard(blob, file.name); toast('Partage direct indisponible ici : image enregistrée');
}
function saveCard(blob, name){ const go = b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name || 'verset.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  if (blob) go(blob); else VCANVAS.toBlob(b => go(b), 'image/png'); }

// un toucher sur un lien vers la Bible d'étude : on affiche le verset dans l'appli si on l'a
document.addEventListener('click', e => {
  const a = e.target.closest('a[href*="bible-d-etude/livres/"]');
  if (a && !a.closest('#form')){ const k = keyFromURL(a.href); if (k && showVerse(k, a.href)){ e.preventDefault(); } return; }
  const b = e.target.closest('button'); if (!b || !VSEL) return; const d = b.dataset;
  if ('vcard' in d) cardDialog();
  else if ('vback' in d) showVerse(VSEL.k, VSEL.url);
  else if ('vshare' in d) shareCard();
  else if ('vsave' in d) saveCard(null, selCitation().replace(/[^\wÀ-ÿ]+/g, '-') + '.png');
  else if ('vcopy' in d){ const t = '« ' + selText() + ' » (' + selCitation() + ', Traduction du monde nouveau)\n' + VSEL.url;
    try { navigator.clipboard.writeText(t).then(() => toast('Verset copié'), () => toast('Copie impossible ici')); } catch(_){ toast('Copie impossible ici'); } }
  else if ('vtv' in d){ tvAdd({titre: selCitation(), texte: selText(), verset: 'Traduction du monde nouveau'}); }
});

/* ---------- application installable (PWA) ---------- */
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let INSTALL = null, HIDEINST = false; try { HIDEINST = localStorage.getItem('carnet-install-ok') === '1'; } catch(e){}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL = e; if (route() === 'semaine') render(true); });
addEventListener('appinstalled', () => { INSTALL = null; toast('Application installée ✓'); render(true); });
function installCard(){
  if (STANDALONE || HIDEINST || location.protocol === 'file:') return '';
  const how = INSTALL ? `<button class="btn pri" data-install>Installer l'application</button>`
    : IOS ? `<p class="note" style="margin:0">Dans Safari : touche <b>Partager</b> <span aria-hidden="true">⬆︎</span> puis <b>« Sur l'écran d'accueil »</b>.</p>`
    : `<p class="note" style="margin:0">Dans le menu du navigateur : <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>.</p>`;
  return `<div class="card" style="margin-top:12px"><h3>📲 Installe le carnet sur ton téléphone</h3><p class="note" style="margin:6px 0 12px">Il s'ouvrira comme une vraie application et fonctionnera sans connexion.</p>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${how}<button class="btn" data-noinstall>Plus tard</button></div></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if ('install' in t.dataset && INSTALL){ INSTALL.prompt(); try { await INSTALL.userChoice; } catch(_){} INSTALL = null; render(true); }
  if ('noinstall' in t.dataset){ HIDEINST = true; try { localStorage.setItem('carnet-install-ok','1'); } catch(_){} render(true); }
});
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    // une nouvelle version a été téléchargée : on le signale
    reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Nouvelle version prête : ferme et rouvre le carnet'); }); });
  }).catch(() => {}));
}
addEventListener('offline', () => toast('Hors connexion : tout reste disponible'));
COMMENTS = loadLocal(); TALKS = loadTalks();
let LOADERR = false;
async function loadWeeks(){
  try { const r = await fetch('semaines.json', {cache:'no-cache'}); if (!r.ok) throw 0;
    const d = await r.json(); (d.semaines || d).forEach(w => WEEKS[w.id] = w); }
  catch(e){ LOADERR = true; }
  render(true);
}
render(); loadWeeks(); loadCulte(); loadVerses();


/* ---------- base de données (semaines + commentaires) ---------- */
(async () => {
  if (!window.claude || !claude.use) return;
  const db = await claude.use('db'); if (!db) return;
  DB = db;
  db.collection('semaines').onSnapshot(s => {
    let ch = false; s.docs.forEach(d => { const w = d.data(); if (w && w.id && w.reunions){ WEEKS[w.id] = w; ch = true; } });
    if (ch) render(true);
  }, () => {});
  const user = await claude.use('user'); UID = user ? await user.id() : null; if (!UID) return;
  const local = loadLocal(); let first = true;
  db.collection('data/users/' + UID).onSnapshot(async s => {
    MODE = 'db'; COMMENTS = s.docs.map(d => ({...d.data(), id: d.id}));
    if (first){ first = false;
      const miss = local.filter(l => !COMMENTS.some(c => c.id === l.id));
      for (const c of miss){ try { await db.collection('data/users/' + UID).doc(c.id).set(c); } catch(e){ MODE = 'local'; break; } }
      if (MODE === 'db' && miss.length){ try { localStorage.removeItem(LS); } catch(e){} }
    }
    render(true);
  }, () => { MODE = 'local'; });
})();
})();
